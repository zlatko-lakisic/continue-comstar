name: Main Branch Build

# Download and republish VS Code extension artifacts when code is merged to main.
# Falls back to a fresh build when PR branch runs are unavailable (e.g. branch deleted).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: "PR number to test with"
        required: true

jobs:
  republish-pr-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: Linux
            build_platform: linux
            build_arch: x64
            artifact_candidates: >-
              vscode-extension-build-Linux
              vscode-extension-build-linux-x64
          - platform: macOS
            build_platform: darwin
            build_arch: arm64
            artifact_candidates: >-
              vscode-extension-build-macOS
              vscode-extension-build-darwin-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Get merged PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ github.event.inputs.test_pr_number }}"
          else
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "Getting PR for commit: $COMMIT_SHA"
            PR_NUMBER=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
              | jq -r '.[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find PR for this commit"
            exit 1
          fi

          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find PR workflow run
        id: find-run
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Resolving PR #$PR_NUMBER head commit..."

          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefOid,headRefName)
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          BRANCH_NAME=$(echo "$PR_JSON" | jq -r '.headRefName')

          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" = "null" ]; then
            echo "❌ Could not resolve PR #$PR_NUMBER head commit"
            exit 1
          fi

          echo "PR branch: $BRANCH_NAME"
          echo "PR head SHA: $HEAD_SHA"
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          find_run() {
            local workflow="$1"
            local require_success="$2"
            gh run list \
              --repo "${{ github.repository }}" \
              --workflow="$workflow" \
              --commit="$HEAD_SHA" \
              --limit 20 \
              --json databaseId,status,conclusion \
              --jq "if $require_success then
                .[] | select(.status == \"completed\" and .conclusion == \"success\") | .databaseId
              else
                .[] | select(.status == \"completed\" and .conclusion != \"cancelled\") | .databaseId
              end" \
              | head -1
          }

          RUN_ID=""
          for WORKFLOW in pr-checks.yaml pr-build-upload-vsix.yaml; do
            echo "Trying successful run in $WORKFLOW for commit $HEAD_SHA..."
            RUN_ID=$(find_run "$WORKFLOW" true)
            if [ -n "$RUN_ID" ]; then
              echo "Found successful run $RUN_ID in $WORKFLOW"
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "No green run on head SHA; trying branch $BRANCH_NAME..."
            for WORKFLOW in pr-checks.yaml pr-build-upload-vsix.yaml; do
              RUN_ID=$(gh run list \
                --repo "${{ github.repository }}" \
                --workflow="$WORKFLOW" \
                --branch="$BRANCH_NAME" \
                --limit 20 \
                --json databaseId,status,conclusion \
                --jq '.[] | select(.status == "completed" and .conclusion != "cancelled") | .databaseId' \
                | head -1)
              if [ -n "$RUN_ID" ]; then
                echo "Found run $RUN_ID in $WORKFLOW on branch $BRANCH_NAME"
                break
              fi
            done
          fi

          if [ -z "$RUN_ID" ]; then
            echo "No PR workflow run with artifacts; will build on main"
            echo "run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Using workflow run: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download PR artifact
        id: download
        if: steps.find-run.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./temp-download

          read -r -a CANDIDATES <<< "${{ matrix.artifact_candidates }}"
          DOWNLOADED=0
          for ARTIFACT in "${CANDIDATES[@]}"; do
            echo "📥 Trying artifact: $ARTIFACT from run $RUN_ID..."
            if gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "$ARTIFACT" \
              --dir "./temp-download"; then
              echo "✅ Downloaded $ARTIFACT"
              DOWNLOADED=1
              break
            fi
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "Could not download artifacts from run $RUN_ID; will build on main"
            echo "downloaded=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "downloaded=true" >> $GITHUB_OUTPUT

      - name: Build VS Code extension (fallback)
        if: steps.find-run.outputs.run_id == '' || steps.download.outputs.downloaded == 'false'
        uses: ./.github/actions/build-vscode-extension
        with:
          platform: ${{ matrix.build_platform }}
          arch: ${{ matrix.build_arch }}
          npm_config_arch: ${{ matrix.build_arch }}
          pre-release: false
          commit-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage fallback build output
        if: steps.find-run.outputs.run_id == '' || steps.download.outputs.downloaded == 'false'
        run: |
          mkdir -p ./temp-download
          cp -r extensions/vscode/build/. ./temp-download/

      - name: Republish as main branch artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-build-${{ matrix.platform }}
          path: ./temp-download/*
