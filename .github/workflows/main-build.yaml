name: Main Branch Build

# Download and republish VS Code extension artifacts when code is merged to main
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_pr_number:
        description: "PR number to test with"
        required: true

jobs:
  republish-pr-artifacts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [Linux, macOS]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Get merged PR number
        id: get-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ github.event.inputs.test_pr_number }}"
          else
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "Getting PR for commit: $COMMIT_SHA"
            PR_NUMBER=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/pulls" \
              | jq -r '.[0].number // empty')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not find PR for this commit"
            exit 1
          fi

          echo "Found PR number: $PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Find PR workflow run
        id: find-run
        env:
          PR_NUMBER: ${{ steps.get-pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Getting branch name for PR #$PR_NUMBER..."

          BRANCH_NAME=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')

          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ Could not find PR #$PR_NUMBER"
            exit 1
          fi

          echo "Branch name: $BRANCH_NAME"

          RUN_ID=""
          for WORKFLOW in pr-checks.yaml pr-build-upload-vsix.yaml; do
            echo "Trying workflow: $WORKFLOW"
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow="$WORKFLOW" \
              --branch="$BRANCH_NAME" \
              --limit 20 \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
              | head -1)
            if [ -n "$RUN_ID" ]; then
              echo "Found successful run $RUN_ID in $WORKFLOW"
              break
            fi
          done

          if [ -z "$RUN_ID" ]; then
            echo "No fully green PR run; trying latest PR Build And Upload VSIX with artifacts..."
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow="pr-build-upload-vsix.yaml" \
              --branch="$BRANCH_NAME" \
              --limit 10 \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed" and .conclusion != "cancelled") | .databaseId' \
              | head -1)
          fi

          if [ -z "$RUN_ID" ]; then
            echo "❌ No usable workflow run found for PR #$PR_NUMBER (branch: $BRANCH_NAME)"
            exit 1
          fi

          echo "Using workflow run: $RUN_ID"
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Download PR artifact
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./temp-download

          if [ "$PLATFORM" = "Linux" ]; then
            CANDIDATES=(vscode-extension-build-Linux vscode-extension-build-linux-x64)
          else
            CANDIDATES=(vscode-extension-build-macOS vscode-extension-build-darwin-arm64)
          fi

          DOWNLOADED=0
          for ARTIFACT in "${CANDIDATES[@]}"; do
            echo "📥 Trying artifact: $ARTIFACT from run $RUN_ID..."
            if gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "$ARTIFACT" \
              --dir "./temp-download"; then
              echo "✅ Downloaded $ARTIFACT"
              DOWNLOADED=1
              break
            fi
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "❌ Failed to download any artifact for $PLATFORM from run $RUN_ID"
            exit 1
          fi

      - name: Republish as main branch artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-build-${{ matrix.platform }}
          path: ./temp-download/*
