      #     cd extensions/vscode
      #     npm version patch
      # - name: Commit changes
      #   run: |
      #     git config --local user.email "action@github.com"
      #     git config --local user.name "GitHub Action"
      #     git commit -am "💚 Update package.json version [skip ci]"

