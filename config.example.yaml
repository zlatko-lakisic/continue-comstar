name: continue-comstar
version: 0.0.1
schema: v1

models:
  # General coding — packs overlays/comstar-code and tunnels the open workspace.
  - name: COMSTAR Code
    provider: ao_reach
    baseUrl: wss://ao.lan:8765
    apiKey: $AO_REACH_TOKEN
    sessionOverlay: comstar-code
    timeoutSeconds: 0
    streamingEnabled: true
    # Prefer a local YAML (or overlay folder) over the pack compiled into the VSIX:
    # agentDefinition: ~/continue-comstar/overlays/comstar-code/agent_providers/code_assistant.yaml
    # sessionOverlay: comstar-code

  # Code review — overlays/comstar-code-review
  - name: COMSTAR Review
    provider: ao_reach
    baseUrl: wss://ao.lan:8765
    apiKey: $AO_REACH_TOKEN
    sessionOverlay: comstar-code-review
    timeoutSeconds: 0
    streamingEnabled: true
    # agentDefinition: ~/continue-comstar/overlays/comstar-code-review/agent_providers/code_reviewer.yaml

# Session IDs are derived from workspace name by default.
# To pin a session explicitly:
#   sessionId: comstar-zlatko-global

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
