name: continue-comstar
version: 0.0.1
schema: v1

models:
  # General coding — packs overlays/comstar-code and tunnels the open workspace.
  - name: COMSTAR Code
    provider: ao_reach
    baseUrl: wss://ao.lan:8765
    apiKey: $AO_REACH_TOKEN
    sessionOverlay: comstar-code
    timeoutSeconds: 15
    streamingEnabled: true
    # mtlsMaterialDir: ~/.continue-comstar/ao-mtls
    # filesystemTunnel: true

  # Code review — overlays/comstar-code-review
  - name: COMSTAR Review
    provider: ao_reach
    baseUrl: wss://ao.lan:8765
    apiKey: $AO_REACH_TOKEN
    sessionOverlay: comstar-code-review
    timeoutSeconds: 30
    streamingEnabled: true

# Session IDs are derived from workspace name by default.
# To pin a session explicitly:
#   sessionId: comstar-zlatko-global

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase
